<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets us paint into the notch / home-indicator
         areas; the safe-area-inset-* vars in global.css keep content clear of them.
         maximum-scale + user-scalable=no stops iOS zooming the page when you focus
         a number input mid-set. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Slot-based workout tracker. Swap exercises, keep your history." />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS standalone / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slots" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />

    <title>Slots</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
